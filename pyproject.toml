[project]
name = "selma-bench"
version = "0.1.0"
description = "Swedish exam test bench: Högskoleprovet questions, model runners, damage checks and reports."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pymupdf>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
# Needed only to run real models on the GPU machine (not for fetching, extracting or dry runs).
gpu = [
    "accelerate>=1.0",
    "torch>=2.5",
    "transformers>=4.57",
]

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
